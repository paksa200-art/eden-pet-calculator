<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에덴 관리자 업데이트</title><style>body{font-family:system-ui,sans-serif;background:#fff;color:#172333;max-width:560px;margin:8vh auto;padding:20px}main{background:#fff;border:1px solid #e5eaf0;border-radius:18px;padding:24px}input,button{box-sizing:border-box;width:100%;padding:14px;margin-top:12px;border-radius:9px;font-size:16px}input{background:#fff;color:#172333;border:1px solid #d8e0e9}button{border:0;background:#2563eb;color:white;font-weight:700;cursor:pointer}small{color:#64748b}#result{white-space:pre-wrap;margin-top:18px}</style></head><body><main><h1>🐾 에덴 페트 관리자</h1><p>toinfo.work 전체 페트 정보를 조회해 에덴 계산기에 반영합니다.</p><small>관리자 비밀번호는 서버에만 설정하며 브라우저에 저장하지 않습니다. 사이트에 등록된 페트만 사용하며 기존 487마리 데이터는 사용하지 않습니다.</small><input id="key" type="password" autocomplete="off" placeholder="관리자 업데이트 비밀번호"><button id="go">↻ 원클릭 즉시 업데이트</button><p id="result" role="status"></p><p><a style="color:#2563eb" href="/">계산기로 돌아가기</a></p></main><script>document.getElementById('go').onclick=async()=>{const b=document.getElementById('go'),out=document.getElementById('result');b.disabled=true;out.textContent='업데이트 실행 요청 중…';try{const r=await fetch('/api/update',{method:'POST',headers:{'x-admin-key':document.getElementById('key').value}});const j=await r.json();out.textContent=j.message||j.error||'알 수 없는 응답';}catch(e){out.textContent='서버 연결 실패';}finally{b.disabled=false;document.getElementById('key').value='';}};</script></body></html>
