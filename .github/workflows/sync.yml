
name: Admin pet update

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync.yml'

permissions:
  contents: write

concurrency:
  group: pet-catalog-update
  cancel-in-progress: false

jobs:
  sync:
    name: Update pet data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4==4.12.3

      - name: Check required files
        run: |
          test -f scripts/sync_pets.py
          test -f data/pets.json

      - name: Collect pet data
        run: |
          python scripts/sync_pets.py

      - name: Save updated pet data
        run: |
          if ! git diff --quiet -- data/pets.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/pets.json
            git commit -m "Update pet data from toinfo.work"
            git push
          else
            echo "No pet data changes"
          fi
