
name: Admin pet update

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync.yml'

permissions:
  contents: write

concurrency:
  group: pet-catalog-update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install beautifulsoup4==4.12.3

      - name: Fetch toinfo.work and merge pets
        run: python scripts/sync_pets.py

      - name: Commit changes if any
        run: |
          if ! git diff --quiet -- data/pets.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/pets.json
            git commit -m "Sync pet data from toinfo.work"
            git push
          fi
